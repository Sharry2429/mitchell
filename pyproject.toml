[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mitchell"
version = "1.0.0"
description = "Mitchell - Autonomous Multi-Agent Hive & Task Orchestration Framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Mitchell Team" }
]
keywords = ["agent", "orchestration", "hive", "llm", "automation", "browser", "playwright", "windows", "android", "cross-platform"]

dependencies = [
    # Core
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "rich>=13.7.0",
    "typer>=0.9.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.2",
    "aiofiles>=23.2.1",
    "orjson>=3.9.15",
    "websockets>=12.0",
    "Pillow>=10.0.0",
    "requests>=2.32.0",

    # Browser Pillar (cross-platform)
    "playwright>=1.42.0",

    # Windows Pillar (Windows only)
    "pywinauto>=0.6.8; sys_platform == 'win32'",
    "pywin32>=310; sys_platform == 'win32'",
    "comtypes>=1.4.0; sys_platform == 'win32'",

    # Voice (cross-platform)
    "pyttsx3>=2.90",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[project.scripts]
mitchell = "mitchell.cli:app"
mitchell-do = "mitchell.cli:do"
mitchell-mcp = "mitchell.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["mitchell"]

[tool.pytest.ini_options]
testpaths = ["tests"]

