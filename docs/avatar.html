<!DOCTYPE html>
<html lang="en" data-theme="oled">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Mitchell — Grok Mode (x.ai style)</title>
  <meta name="description" content="Grok-style interactive autonomous AI bot with 3D geometric wireframe avatar and real-time voice streaming." />
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            display: ['"Outfit"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            black: '#000000',
            carbon: '#0a0a0c',
            surface: '#111216',
            border: 'rgba(255, 255, 255, 0.1)',
            cyan: '#00e5ff',
            amber: '#ff9900',
            mint: '#00ff88',
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: 'Outfit', sans-serif;
    }
    .grok-input-pill {
      background: rgba(18, 18, 22, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
      transition: all 0.25s ease;
    }
    .grok-input-pill:focus-within {
      border-color: rgba(255, 255, 255, 0.35);
      box-shadow: 0 10px 50px rgba(0, 0, 0, 0.95), 0 0 20px rgba(255, 255, 255, 0.05);
    }
    .grok-mode-btn {
      transition: all 0.2s ease;
    }
    .grok-mode-btn.active {
      background: #ffffff;
      color: #000000;
      font-weight: 600;
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 999px;
    }
  </style>
</head>
<body class="bg-black text-white min-h-screen flex flex-col justify-between overflow-hidden selection:bg-white/20 selection:text-white">

  <!-- Top Minimalist Bar -->
  <header class="w-full px-6 py-4 flex items-center justify-between z-30 border-b border-white/5 bg-black/80 backdrop-blur-md">
    <div class="flex items-center gap-4">
      <a href="index.html" class="flex items-center gap-2 text-white hover:opacity-80 transition-opacity">
        <div class="w-7 h-7 bg-white text-black font-black text-sm flex items-center justify-center rounded">
          /
        </div>
        <span class="font-bold text-base tracking-tight font-mono">GROK · MITCHELL</span>
      </a>

      <!-- Mode Selector Pills -->
      <div class="hidden sm:flex items-center gap-1 p-1 bg-surface border border-border rounded-full text-xs font-mono">
        <button onclick="setGrokMode('normal')" id="mode-normal" class="grok-mode-btn active px-3.5 py-1 rounded-full text-white/80">Normal</button>
        <button onclick="setGrokMode('fun')" id="mode-fun" class="grok-mode-btn px-3.5 py-1 rounded-full text-white/60 hover:text-white">Fun</button>
        <button onclick="setGrokMode('think')" id="mode-think" class="grok-mode-btn px-3.5 py-1 rounded-full text-white/60 hover:text-white">DeepSearch</button>
        <button onclick="setGrokMode('hive')" id="mode-hive" class="grok-mode-btn px-3.5 py-1 rounded-full text-white/60 hover:text-white">Hive Mode</button>
      </div>
    </div>

    <!-- Right Controls -->
    <div class="flex items-center gap-3 text-xs font-mono">
      <div id="status-badge" class="flex items-center gap-2 px-3 py-1 rounded-full bg-white/5 border border-white/10 text-white/70">
        <span class="w-2 h-2 rounded-full bg-mint animate-pulse"></span>
        <span id="status-text">Grok-3 Engine Active</span>
      </div>
      <a href="studio.html" class="px-3 py-1 rounded-full bg-white/5 hover:bg-white/10 border border-white/10 text-white/80 transition-colors">
        Studio
      </a>
      <a href="index.html" class="px-3 py-1 rounded-full bg-white/5 hover:bg-white/10 border border-white/10 text-white/80 transition-colors">
        Docs
      </a>
    </div>
  </header>

  <!-- Center Stage: 3D Geometric Wireframe Polyhedron Avatar -->
  <main class="relative flex-1 flex flex-col items-center justify-center px-6 my-auto z-10">
    <div class="relative w-72 h-72 sm:w-88 sm:h-88 flex items-center justify-center">
      <!-- Glow Aura -->
      <div id="orb-ambient" class="absolute inset-0 rounded-full blur-[80px] opacity-30 bg-gradient-to-tr from-white via-cyan to-amber transition-all duration-700"></div>
      
      <!-- 3D Wireframe Canvas -->
      <canvas id="wireframe-canvas" width="360" height="360" class="relative z-10 cursor-pointer" title="Click to toggle Voice Interaction"></canvas>
    </div>

    <!-- Live Dynamic Subtitle / Transcript -->
    <div id="transcript-area" class="mt-6 text-center max-w-xl mx-auto min-h-[44px] flex items-center justify-center">
      <p id="live-caption" class="text-sm sm:text-base font-display text-white/80 leading-relaxed font-light">
        "Ask me anything, or instruct Mitchell to automate your desktop, phone, or browser."
      </p>
    </div>

    <!-- Audio Waveform Visualizer (Active during speech) -->
    <div id="audio-wave-bars" class="flex items-center gap-1 mt-4 h-6 opacity-40">
      <span class="w-1 h-2 bg-white rounded-full transition-all duration-75"></span>
      <span class="w-1 h-4 bg-white rounded-full transition-all duration-75"></span>
      <span class="w-1 h-6 bg-white rounded-full transition-all duration-75"></span>
      <span class="w-1 h-3 bg-white rounded-full transition-all duration-75"></span>
      <span class="w-1 h-5 bg-white rounded-full transition-all duration-75"></span>
      <span class="w-1 h-2 bg-white rounded-full transition-all duration-75"></span>
      <span class="w-1 h-4 bg-white rounded-full transition-all duration-75"></span>
    </div>
  </main>

  <!-- Bottom Floating Chat Bar -->
  <footer class="w-full max-w-3xl mx-auto px-6 pb-8 z-30">
    <div class="grok-input-pill rounded-2xl p-2 sm:p-2.5 flex items-center gap-3">
      <!-- Voice Mic Button -->
      <button onclick="toggleVoiceRecording()" id="btn-mic" class="w-10 h-10 rounded-xl bg-white/5 hover:bg-white/15 border border-white/10 flex items-center justify-center text-white/80 hover:text-white transition-all">
        <i class="fa-solid fa-microphone text-sm"></i>
      </button>

      <!-- Text Input -->
      <input type="text" id="grok-prompt" placeholder="Ask Grok anything, search the web, or execute multi-device goals..." class="flex-1 bg-transparent text-sm sm:text-base text-white placeholder-white/40 focus:outline-none font-display" />

      <!-- DeepSearch / Think Toggle -->
      <button onclick="toggleDeepSearch()" id="btn-deepsearch" class="hidden sm:flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 text-xs font-mono text-white/70 transition-colors">
        <i class="fa-solid fa-brain text-xs text-amber"></i> Think
      </button>

      <!-- Submit Arrow -->
      <button onclick="submitGrokPrompt()" class="w-10 h-10 rounded-xl bg-white text-black hover:bg-white/90 flex items-center justify-center font-bold text-sm transition-transform active:scale-95">
        <i class="fa-solid fa-arrow-up"></i>
      </button>
    </div>
  </footer>

  <!-- 3D Geometric Wireframe Polyhedron Engine -->
  <script>
    const canvas = document.getElementById('wireframe-canvas');
    const ctx = canvas.getContext('2d');
    const ambientGlow = document.getElementById('orb-ambient');
    const liveCaption = document.getElementById('live-caption');
    const statusText = document.getElementById('status-text');

    let currentMode = 'normal';
    let agentState = 'idle'; // 'idle', 'listening', 'thinking', 'speaking', 'action'
    let isDeepSearch = false;
    let isVoiceActive = false;

    // 3D Geometry: Construct icosahedron vertices & wireframe edges
    const t = (1.0 + Math.sqrt(5.0)) / 2.0;
    let baseVertices = [
      [-1, t, 0], [1, t, 0], [-1, -t, 0], [1, -t, 0],
      [0, -1, t], [0, 1, t], [0, -1, -t], [0, 1, -t],
      [t, 0, -1], [t, 0, 1], [-t, 0, -1], [-t, 0, 1]
    ];

    // Normalize vertices to unit sphere
    baseVertices = baseVertices.map(v => {
      const len = Math.sqrt(v[0]*v[0] + v[1]*v[1] + v[2]*v[2]);
      return [v[0]/len, v[1]/len, v[2]/len];
    });

    // Edges connecting vertices
    const edges = [
      [0, 11], [0, 5], [0, 1], [0, 7], [0, 10],
      [1, 5], [5, 11], [11, 10], [10, 7], [7, 1],
      [3, 9], [3, 4], [3, 2], [3, 6], [3, 8],
      [4, 9], [9, 8], [8, 6], [6, 2], [2, 4],
      [4, 5], [5, 9], [9, 1], [1, 8], [8, 7],
      [7, 6], [6, 10], [10, 2], [2, 11], [11, 4]
    ];

    let angleX = 0;
    let angleY = 0;
    let angleZ = 0;
    let timeVal = 0;

    function render3DWireframe() {
      timeVal += 0.02;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Rotational speed depends on state
      const rotSpeed = (agentState === 'thinking') ? 0.045 : (agentState === 'listening' ? 0.025 : 0.012);
      angleX += rotSpeed;
      angleY += rotSpeed * 1.3;
      angleZ += rotSpeed * 0.7;

      const scale = 110;
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;

      // Color scheme based on state
      let wireColor = 'rgba(255, 255, 255, 0.45)';
      let nodeColor = 'rgba(255, 255, 255, 0.9)';
      let glowColor = 'rgba(255, 255, 255, 0.2)';

      if (agentState === 'listening') {
        wireColor = 'rgba(0, 229, 255, 0.7)';
        nodeColor = '#00e5ff';
        glowColor = 'rgba(0, 229, 255, 0.5)';
      } else if (agentState === 'thinking') {
        wireColor = 'rgba(255, 153, 0, 0.8)';
        nodeColor = '#ff9900';
        glowColor = 'rgba(255, 153, 0, 0.6)';
      } else if (agentState === 'speaking') {
        wireColor = 'rgba(0, 255, 136, 0.75)';
        nodeColor = '#00ff88';
        glowColor = 'rgba(0, 255, 136, 0.5)';
      }

      // Rotate and project 3D vertices
      const projected = baseVertices.map((v, idx) => {
        // Harmonic deformation wave
        let wave = Math.sin(timeVal * 3 + idx) * 0.08;
        if (agentState === 'speaking') wave += Math.sin(timeVal * 8 + idx * 2) * 0.15;
        if (agentState === 'listening') wave += Math.cos(timeVal * 6 + idx) * 0.12;

        let x = v[0] * (1 + wave);
        let y = v[1] * (1 + wave);
        let z = v[2] * (1 + wave);

        // Rotation Matrix Y
        let x1 = x * Math.cos(angleY) + z * Math.sin(angleY);
        let z1 = -x * Math.sin(angleY) + z * Math.cos(angleY);

        // Rotation Matrix X
        let y2 = y * Math.cos(angleX) - z1 * Math.sin(angleX);
        let z2 = y * Math.sin(angleX) + z1 * Math.cos(angleX);

        // Rotation Matrix Z
        let x3 = x1 * Math.cos(angleZ) - y2 * Math.sin(angleZ);
        let y3 = x1 * Math.sin(angleZ) + y2 * Math.cos(angleZ);

        // Perspective projection
        const fov = 3.5;
        const pz = z2 + fov;
        const projX = (x3 / pz) * scale * 2.5 + cx;
        const projY = (y3 / pz) * scale * 2.5 + cy;

        return { x: projX, y: projY, z: z2 };
      });

      // Draw wireframe connecting lines
      ctx.lineWidth = (agentState === 'thinking' || agentState === 'listening') ? 1.6 : 1.2;
      ctx.strokeStyle = wireColor;

      edges.forEach(([i, j]) => {
        const p1 = projected[i];
        const p2 = projected[j];
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
      });

      // Draw glowing vertex nodes
      projected.forEach(p => {
        const radius = (agentState === 'speaking' || agentState === 'listening') ? 3.5 : 2.5;
        ctx.beginPath();
        ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
        ctx.fillStyle = nodeColor;
        ctx.shadowColor = glowColor;
        ctx.shadowBlur = 12;
        ctx.fill();
        ctx.shadowBlur = 0;
      });

      requestAnimationFrame(render3DWireframe);
    }
    render3DWireframe();

    // Mode Toggle
    function setGrokMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.grok-mode-btn').forEach(btn => {
        btn.className = 'grok-mode-btn px-3.5 py-1 rounded-full text-white/60 hover:text-white';
      });
      document.getElementById(`mode-${mode}`).className = 'grok-mode-btn active px-3.5 py-1 rounded-full text-white/80';
      
      if (mode === 'fun') {
        liveCaption.textContent = '"Grok Mode: Unfiltered, witty, and ready for radical thoughts."';
      } else if (mode === 'think') {
        liveCaption.textContent = '"DeepSearch Mode: Conducting multi-pass reasoning and web verification."';
      } else if (mode === 'hive') {
        liveCaption.textContent = '"Hive Automation Mode: Multi-device cross-platform orchestration active."';
      } else {
        liveCaption.textContent = '"Ask me anything, or instruct Mitchell to automate your desktop, phone, or browser."';
      }
    }

    // Toggle Voice Interaction
    function toggleVoiceRecording() {
      isVoiceActive = !isVoiceActive;
      const micBtn = document.getElementById('btn-mic');
      if (isVoiceActive) {
        agentState = 'listening';
        micBtn.className = 'w-10 h-10 rounded-xl bg-cyan text-black font-bold flex items-center justify-center shadow-[0_0_20px_rgba(0,229,255,0.4)]';
        liveCaption.textContent = '"Listening... speak your request."';
        ambientGlow.className = "absolute inset-0 rounded-full blur-[80px] opacity-50 bg-cyan transition-all duration-500";
      } else {
        agentState = 'idle';
        micBtn.className = 'w-10 h-10 rounded-xl bg-white/5 hover:bg-white/15 border border-white/10 flex items-center justify-center text-white/80 hover:text-white transition-all';
        liveCaption.textContent = '"Voice session ended. Ready."';
        ambientGlow.className = "absolute inset-0 rounded-full blur-[80px] opacity-30 bg-gradient-to-tr from-white via-cyan to-amber transition-all duration-700";
      }
    }

    // Toggle DeepSearch
    function toggleDeepSearch() {
      isDeepSearch = !isDeepSearch;
      const btn = document.getElementById('btn-deepsearch');
      if (isDeepSearch) {
        btn.className = 'hidden sm:flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-amber/20 border border-amber text-xs font-mono text-amber';
      } else {
        btn.className = 'hidden sm:flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 text-xs font-mono text-white/70 transition-colors';
      }
    }

    // Submit Prompt
    function submitGrokPrompt() {
      const input = document.getElementById('grok-prompt');
      const text = input.value.trim();
      if (!text) return;

      input.value = '';
      agentState = 'thinking';
      ambientGlow.className = "absolute inset-0 rounded-full blur-[90px] opacity-60 bg-amber transition-all duration-500";
      liveCaption.textContent = `"${text}" — Synthesizing multi-agent action plan...`;

      setTimeout(() => {
        agentState = 'speaking';
        ambientGlow.className = "absolute inset-0 rounded-full blur-[80px] opacity-50 bg-mint transition-all duration-500";
        liveCaption.innerHTML = `<strong>Grok:</strong> I have executed the task, verified live citations, and updated the Hive blackboard.`;
        
        setTimeout(() => {
          agentState = 'idle';
          ambientGlow.className = "absolute inset-0 rounded-full blur-[80px] opacity-30 bg-gradient-to-tr from-white via-cyan to-amber transition-all duration-700";
        }, 5000);
      }, 1800);
    }

    // Enter key submits prompt
    document.getElementById('grok-prompt').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') submitGrokPrompt();
    });
  </script>
</body>
</html>
